<!DOCTYPE html>
<html>
<head>
  <title>Stellive Monitor</title>
  <style>
    body {
      background: #0f172a;
      font-family: Arial;
      color: white;
      text-align: center;
    }
    h1 { margin-top: 30px; }
    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 25px;
      margin-top: 40px;
    }
    .card {
      width: 260px;
      border-radius: 18px;
      background: #1e293b;
      overflow: hidden;
      transition: .3s;
      box-shadow: 0 8px 25px rgba(0,0,0,.5);
    }
    .card.live {
      background: linear-gradient(135deg,#065f46,#10b981);
      transform: scale(1.05);
    }
    .thumb {
      width: 100%;
      height: 150px;
      object-fit: cover;
    }
    .content { padding: 15px; }
    .name { font-weight: bold; font-size: 18px; }
    .live-text { color:#00ff88; }
    .offline-text { color:#ff4d4d; }
  </style>
</head>
<body>

<h1>Stellive CHZZK Monitor</h1>
<div class="container" id="list"></div>

<script>
async function loadData() {
  const res = await fetch("/api");
  const data = await res.json();

  const html = data.map(s => `
    <a href="https://chzzk.naver.com/${s.channelId}" target="_blank" style="text-decoration:none;color:inherit;">
      <div class="card ${s.status==="live"?"live":""}">
        <img class="thumb"
             src="/image?url=${encodeURIComponent(s.thumbnail)}&t=${Date.now()}"
             onerror="this.src='';">
        <div class="content">
          <div class="name">${s.name}</div>
          <div class="${s.status==="live"?"live-text":"offline-text"}">
            ${s.status==="live"?"🟢 LIVE":"🔴 OFFLINE"}
          </div>
          ${s.status==="live" ? `
            <div>👥 ${s.viewers}명</div>
            <div>${s.title}</div>
            <div style="opacity:.6">${s.category}</div>
          ` : ""}
        </div>
      </div>
    </a>
  `).join("");

  document.getElementById("list").innerHTML = html;
}

loadData();
setInterval(loadData, 60000);
</script>

</body>
</html>
